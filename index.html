<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <script>
        if (location.hash) {
            document.write(decodeURIComponent(location.hash.slice(1)));
        } else {
            document.body.innerHTML = "<h2 style='color:#fff;font-family:sans-serif;text-align:center;margin-top:20vh'>Scan the QR code to play the game! 🎄✨</h2>";
        }
    </script>
</body>
</html>
